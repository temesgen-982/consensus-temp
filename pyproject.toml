[project]
name = "consensus"
version = "0.1.0"
description = "Compare football predictions across tipster sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
consensus = "consensus.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["consensus*"]

[tool.pytest.ini_options]
pythonpath = ["."]
